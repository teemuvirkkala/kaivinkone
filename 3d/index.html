<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaivinkone 3D</title>
<script>window.sets = [{"number": "KAIVINKONE001", "label": "Pyörillä, ohjaamo vasemmalla"}]; window.model = ".mpd.txt";</script>
<script>
// The set's files and the lock's time are asked for at once, before the stylesheet and while the page's modules load
// (#219): viewer.js takes them from here, the lock checked before it shows the model
window.unlock = fetch('../unlock.json', { cache: 'no-store' });
window.setFiles = number => {
  const get = (ext, as) => fetch(number + ext).then(r => {
    if (!r.ok) throw new Error(`${number}${ext}: ${r.status}`);
    return r[as]();
  });
  return { json: get('.json', 'json'), model: get(window.model, 'text') };
};
window.first = (sets => {   // window.sets: [{number, label}], tools/web3d.py writes them in
  const asked = new URLSearchParams(location.search).get('set') || location.hash.slice(1).split('/')[0];
  const number = sets.some(s => s.number === asked) ? asked : sets[0].number;
  return { sets, number, files: window.setFiles(number) };
})(window.sets);
</script>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports": {"three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/"}}
</script>

<body>
<canvas id="view" aria-label="Kaivinkone 3D-mallina: vedä kääntääksesi, nipistä zoomataksesi"></canvas>

<header>
  <a class="back" href="../" aria-label="Takaisin ohjeisiin">‹ Ohjeet</a>
  <select id="set" aria-label="Malli"></select>
</header>

<div id="chips" aria-live="polite">
  <span id="build" class="chip build" hidden></span>
  <span id="copies" class="chip copies" hidden></span>
  <span id="turn" class="chip turn" hidden></span>
</div>

<div id="piece" role="dialog" aria-label="Palikka" hidden>
  <span id="swatch" aria-hidden="true"></span>
  <div class="about">
    <div><span id="colour"></span> <span id="shape" lang="en"></span></div>
    <div id="counts"></div>
  </div>
  <button id="unpick" class="close" aria-label="Sulje">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg>
  </button>
</div>

<button id="home" class="round" aria-label="Palauta näkymä" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="2.5"/></svg>
</button>

<div id="done" hidden>Valmis!</div>
<div id="loading">Ladataan palikoita…</div>

<footer>
  <button id="prev" class="nav" aria-label="Edellinen vaihe">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="arrow" d="M17 3 17 21 2 12Z"/></svg>
  </button>
  <div class="where">
    <div class="step"><span id="num">1</span></div>
    <div class="info">
      <div id="page">sivu 2–3</div>
      <div id="caption" lang="en"></div>
      <input id="steps" type="range" min="1" max="1" value="1" step="1" aria-label="Vaihe">
    </div>
  </div>
  <button id="next" class="nav primary" aria-label="Seuraava vaihe">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="arrow" d="M7 3 7 21 22 12Z"/></svg>
  </button>
</footer>

<script type="module" src="viewer.js"></script>
</body></html>
